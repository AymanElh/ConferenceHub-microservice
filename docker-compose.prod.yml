services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: conference-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    networks:
      - conference-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: conference-keycloak
    command: start --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY: edge                          # ← ADD: behind nginx reverse proxy
      KC_HOSTNAME_STRICT: "false"             # ← ADD: flexible hostname
      KC_HTTP_ENABLED: "true"                 # ← ADD: allow HTTP (nginx handles HTTPS)
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - conference-network
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  keynote_db:
    image: mariadb:10.11
    container_name: keynote_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${KEYNOTE_DB_PASSWORD}   # ← FIX: use env var
      MYSQL_DATABASE: keynote
    volumes:
      - keynote-mysqldata:/var/lib/mysql
    networks:
      - conference-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:3.7.0
    container_name: conference-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - conference-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  conference-db:
    image: postgres:16-alpine
    container_name: conference-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CONFERENCE_DB_USER}
      POSTGRES_PASSWORD: ${CONFERENCE_DB_PASSWORD}
      POSTGRES_DB: conference-db
    volumes:
      - conference-pgdata:/var/lib/postgresql/data
    networks:
      - conference-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONFERENCE_DB_USER} -d conference-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0                          # ← FIX: pin version
    container_name: conference-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      conference-network:
        aliases:
          - mongo
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    container_name: conference-mailpit
    restart: unless-stopped
    networks:
      - conference-network

  zipkin:                                     # ← ADD: was referenced but missing
    image: openzipkin/zipkin:3
    container_name: conference-zipkin
    restart: unless-stopped
    networks:
      - conference-network

  config-service:
    image: aymanelh/conferencehub-config:${RELEASE_TAG:-latest}
    container_name: conference-config-service
    restart: unless-stopped
    environment:
      - CONFIG_GIT_URI=${CONFIG_GIT_URI}
      - CONFIG_GIT_USER=${CONFIG_GIT_USER}
      - CONFIG_GIT_PASSWORD=${CONFIG_GIT_PASSWORD}
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - conference-network
    depends_on:
      zipkin:                                 # ← ADD
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-service:
    image: aymanelh/conferencehub-discovery:${RELEASE_TAG:-latest}
    container_name: conference-discovery-service
    restart: unless-stopped
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - conference-network
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-service:
    image: aymanelh/conferencehub-gateway:${RELEASE_TAG:-latest}
    container_name: conference-gateway-service
    restart: unless-stopped
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - conference-network
    depends_on:
      discovery-service:
        condition: service_healthy
    ports:
      - "8881:8881"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8881/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keynote-service:
    image: aymanelh/conferencehub-keynote:${RELEASE_TAG:-latest}
    container_name: conference-keynote-service
    restart: unless-stopped
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - SPRING_DATASOURCE_URL=jdbc:mysql://keynote_db:3306/keynote
      - SPRING_DATASOURCE_USERNAME=${KEYNOTE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${KEYNOTE_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWK_URI=${KEYCLOAK_JWK_URI}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - conference-network
    depends_on:
      discovery-service:
        condition: service_healthy
      keynote_db:                             # ← ADD
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  conference-service:
    image: aymanelh/conferencehub-conference:${RELEASE_TAG:-latest}
    container_name: conference-conference-service
    restart: unless-stopped
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - CONFERENCE_DB_URL=jdbc:postgresql://conference-db:5432/conference-db
      - CONFERENCE_DB_USER=${CONFERENCE_DB_USER}
      - CONFERENCE_DB_PASSWORD=${CONFERENCE_DB_PASSWORD}
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI}
      - KEYCLOAK_JWK_URI=${KEYCLOAK_JWK_URI}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - conference-network
    depends_on:
      discovery-service:
        condition: service_healthy
      conference-db:                          # ← ADD
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service:
    image: aymanelh/conferencehub-notification:${RELEASE_TAG:-latest}
    container_name: conference-notification-service
    restart: unless-stopped
    environment:
      - CONFIG_SERVER_URL=${CONFIG_SERVER_URL}
      - EUREKA_SERVER_URL=${EUREKA_SERVER_URL}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/notification
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - APPLICATION_NOTIFICATION_MANAGERS=${MANAGER_EMAILS}   # ← ADD
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=0.1
      - MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    networks:
      - conference-network
    depends_on:
      discovery-service:
        condition: service_healthy
      mongodb:                                # ← ADD
        condition: service_healthy
      kafka:                                  # ← ADD
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  conference-network:
    driver: bridge

volumes:
  keycloak-pgdata:
  kafka-data:
  conference-pgdata:
  mongodb-data:
  keynote-mysqldata:
