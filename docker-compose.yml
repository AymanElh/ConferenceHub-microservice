services:
  # ═══════════════════════════════════════════════════════════════
  # KEYCLOAK
  # ═══════════════════════════════════════════════════════════════
  keycloak-db:
    image: postgres:16-alpine
    container_name: conference-keycloak-db
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    networks:
      - conference-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5



  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: conference-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - conference-network
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:9000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════════
  # Keynote service db
  # ═══════════════════════════════════════════════════════════════
  keynote_db:
      container_name: keynote_db
      image: mariadb:10.11
      restart: always
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_USER: root
        MYSQL_DATABASE: keynote
      ports:
        - "3306:3306"
      volumes:
        - keynote_db_data:/var/lib/mysql
      networks:
        - keynote_network
      healthcheck:
        test: [ "CMD-SHELL", "mysqladmin ping -uroot -proot || exit 1" ]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s


  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8089:80"
    environment:
      - PMA_HOST=keynote_db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=1024M
      - MEMORY_LIMIT=1024M
      - MAX_EXECUTION_TIME=300
    networks:
          - keynote_network
    depends_on:
      keynote_db:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════
  # KAFKA (KRaft mode — no Zookeeper needed)
  # ═══════════════════════════════════════════════════════════════
  kafka:
    image: apache/kafka:3.7.0
    container_name: conference-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9094:9094"   # host access (Spring Boot services running locally)
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - conference-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # KAFKA UI  — browse topics & messages in browser
  # ═══════════════════════════════════════════════════════════════
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: conference-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: conference-hub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    networks:
      - conference-network
    depends_on:
      kafka:
        condition: service_healthy

networks:
  conference-network:
    driver: bridge
  keynote_network:

volumes:
  keycloak-pgdata:
  kafka-data:
  keynote_db_data:
