spring:
  cloud:
    config:
      enabled: false
      fail-fast: false
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:keynotetest
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false