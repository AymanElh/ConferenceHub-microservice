# ═══════════════════════════════════════════════════════════════
# docker-compose.dev.yml  —  Development overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What this file adds / changes:
#   • Keycloak starts in dev mode (start-dev) and is port-exposed
#   • All infrastructure ports are exposed to localhost for tooling
#   • Dev-only GUI tools: mongo-express, phpMyAdmin, kafka-ui
#   • Mailpit web UI is exposed
# ═══════════════════════════════════════════════════════════════

services:

  # ── Keycloak (dev mode) ───────────────────────────────────────
  keycloak:
    command: start-dev --import-realm
    ports:
      - "8080:8080"

  # ── Databases — expose ports for local tooling ─────────────────
  keycloak-db:
    ports:
      - "5433:5432"       # keycloak postgres (avoid clash with conference-db)

  conference-db:
    ports:
      - "5432:5432"

  keynote_db:
    ports:
      - "3306:3306"

  # ── Messaging ──────────────────────────────────────────────────
  kafka:
    ports:
      - "9094:9094"       # External listener for local producers/consumers

  # ── MongoDB ────────────────────────────────────────────────────
  mongodb:
    ports:
      - "27017:27017"

  # ── Mailpit — expose web UI + SMTP ─────────────────────────────
  mailpit:
    ports:
      - "8025:8025"       # Web UI
      - "1025:1025"       # SMTP

  # ── Application services — expose for local debug ──────────────
  config-service:
    ports:
      - "8888:8888"

  discovery-service:
    ports:
      - "8761:8761"

  gateway-service:
    ports:
      - "8881:8080"

  keynote-service:
    ports:
      - "8081:8081"

  conference-service:
    ports:
      - "8082:8082"

  notification-service:
    ports:
      - "8083:8083"

  # ═══════════════════════════════════════════════════════════════
  # DEV-ONLY GUI TOOLS  (not present in base or prod)
  # ═══════════════════════════════════════════════════════════════

  # Mongo Express — MongoDB web UI
  mongo-express:
    image: mongo-express:latest
    container_name: conference-mongo-express
    restart: unless-stopped
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - conference-network
    depends_on:
      mongodb:
        condition: service_healthy

  # phpMyAdmin — MariaDB web UI
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: conference-phpmyadmin
    restart: unless-stopped
    ports:
      - "8089:80"
    environment:
      PMA_HOST: keynote_db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_ARBITRARY: "1"
    networks:
      - conference-network
    depends_on:
      keynote_db:
        condition: service_healthy

  # Kafka UI — Kafka web UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: conference-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: conference-hub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - conference-network
    depends_on:
      kafka:
        condition: service_healthy


  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: conference-jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "9090:8080"     # Jenkins UI
      - "50000:50000"   # Agent communication
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-in-Docker
      - /usr/bin/docker:/usr/bin/docker              # Docker CLI
    networks:
      - conference-network


  # SonarQube
  sonarqube:
    image: sonarqube:community
    container_name: conference-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - conference-network
    depends_on:
      sonarqube-db:
        condition: service_healthy

  sonarqube-db:
    image: postgres:16-alpine
    container_name: conference-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube-pgdata:/var/lib/postgresql/data
    networks:
      - conference-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  jenkins-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-pgdata: