services:
  keycloak:
    command: start-dev --import-realm
    ports:
      - "8080:8080"

  keynote_db:
    ports:
      - "3306:3306"

  kafka:
    ports:
      - "9094:9094"

  conference-db:
    ports:
      - "5432:5432"

  mongodb:
    ports:
      - "27017:27017"

  config-service:
    ports:
      - "8888:8888"

  discovery-service:
    ports:
      - "8761:8761"

  gateway-service:
    ports:
      - "8080:8080"

  keynote-service:
    ports:
      - "8081:8081"

  conference-service:
    ports:
      - "8082:8082"

  notification-service:
    ports:
      - "8083:8083"

  # ── Dev-only tools ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - "8089:80"
    environment:
      - PMA_HOST=keynote_db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root
      - PMA_ARBITRARY=1
    networks:
      - conference-network
    depends_on:
      keynote_db:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: conference-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: conference-hub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    networks:
      - conference-network
    depends_on:
      kafka:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: conference-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - conference-network
