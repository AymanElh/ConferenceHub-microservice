spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/conference-db
    username: ${CONFERENCE_DB_USER:conf_user}
    password: ${CONFERENCE_DB_PASSWORD:conf_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/conferencehub}


server:
  port: 8082